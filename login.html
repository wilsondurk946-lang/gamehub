<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameHub Login</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0d12;
    color: white;
}

header {
    background: #151821;
    padding: 20px;
    text-align: center;
}

header h1 {
    color: #00ff88;
    margin: 0;
}

.login-box {
    max-width: 400px;
    margin: 70px auto;
    padding: 30px;
    background: #151821;
    border-radius: 12px;
}

h2 {
    text-align: center;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    margin: 10px 0;
    border: none;
    border-radius: 6px;
    background: #252a35;
    color: white;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 6px;
    background: #00ff88;
    color: black;
    font-weight: bold;
    font-size: 16px;
}

.message {
    text-align: center;
    color: #00ff88;
    margin-top: 20px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #aaa;
    text-decoration: none;
}
</style>
</head>

<body>

<header>
    <h1>GAMEHUB</h1>
</header>

<div class="login-box">

    <h2>Sign In</h2>

    <input
        type="email"
        id="email"
        placeholder="Email address"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button onclick="login()">
        Sign In
    </button>

    <p class="message" id="message"></p>

    <a class="back" href="index.html">
        ← Back to GameHub
    </a>

</div>

<script>
function login() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (email === "" || password === "") {
        document.getElementById("message").textContent =
            "Please enter your email and password.";
        return;
    }

    document.getElementById("message").textContent =
        "Login system coming soon!";
}
</script>

</body>
</html>
