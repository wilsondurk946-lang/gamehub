<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameHub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: white;
        }

        header {
            background: #171a23;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            color: #00ff88;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
        }

        .hero h2 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #b8bcc8;
            font-size: 18px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            background: #00ff88;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h1>GAMEHUB</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Store</a>
            <a href="#">Library</a>
            <a href="#">Community</a>
        </nav>
    </header>

    <section class="hero">

        <h2>Discover Your Next Game</h2>

        <p>
            Buy, download and play amazing games.
        </p>

        <a href="#" class="button">
            Browse Games
        </a>

    </section>

</body>
</html>
