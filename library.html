<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameHub Library</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0d12;
    color: white;
}

header {
    background: #151821;
    padding: 20px;
    text-align: center;
}

header h1 {
    color: #00ff88;
    margin: 0 0 15px;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
}

nav a:hover {
    color: #00ff88;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 40px 20px;
}

h2 {
    text-align: center;
    font-size: 32px;
}

.library-card {
    background: #151821;
    padding: 25px;
    border-radius: 12px;
    margin-top: 30px;
    display: flex;
    align-items: center;
    gap: 25px;
}

.game-icon {
    font-size: 70px;
}

.game-info {
    flex: 1;
}

.game-info h3 {
    margin: 0 0 10px;
    font-size: 24px;
}

.status {
    color: #00ff88;
    font-weight: bold;
}

.play-button {
    background: #00ff88;
    color: black;
    border: none;
    padding: 12px 25px;
    border-radius: 6px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>

<h1>GAMEHUB</h1>

<nav>
<a href="index.html">Home</a>

<a href="library.html">Library</a>
<a href="#">Community</a>
</nav>

</header>

<div class="container">

<h2>My Game Library</h2>

<div class="library-card">

<div class="game-icon">⚔️</div>

<div class="game-info">

<h3>Shadow Warriors</h3>

<p>Epic ninja action adventure.</p>

</div>

PLAY
</button>

</div>
