<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameHub Checkout</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0d12;
    color: white;
}

.checkout {
    max-width: 500px;
    margin: 80px auto;
    padding: 30px;
    background: #151821;
    border-radius: 12px;
    text-align: center;
}

h1 {
    color: #00ff88;
}

.game {
    font-size: 60px;
    margin: 20px;
}

.price {
    color: #00ff88;
    font-size: 24px;
    font-weight: bold;
}

button {
    background: #00ff88;
    border: none;
    padding: 15px 30px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

.back {
    display: block;
    margin-top: 20px;
    color: #aaa;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="checkout">

    <h1>GAMEHUB CHECKOUT</h1>

    <div class="game">⚔️</div>

    <h2>Shadow Warriors</h2>

    <p>Epic ninja action adventure.</p>

    <p class="price">$19.99</p>

    <button onclick="alert('Checkout system coming soon!')">
        Continue to Payment
    </button>

    <a class="back" href="game.html">
        ← Back to Game
    </a>

</div>

</body>
</html>
